name: Issue Triage

# 事件驱动分诊：issue 一打开就做三件事
#   1. 检查「证伪报告」的必备字段是否齐全（不齐就礼貌地要，而不是拒收）
#   2. 机械打标签（只依据表单字段，不做任何判断）
#   3. 若配置了 LLM，额外生成一份**分诊草稿**——标注为机器生成，且明确声明它不作裁决
#
# 设计红线（见 docs/automation.md）：
#   本工作流绝不会关闭、否决或降级任何证伪报告。
#   它只做「输入是否完整」与「这属于哪一层」的机械工作，把判断留给人类。

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # 1. 机械分诊：解析 issue 表单，检查必备字段
      # ------------------------------------------------------------------
      - name: 解析表单并打标签
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.issue.body || '');
            const title = (context.payload.issue.title || '');
            const text = title + '\n' + body;

            // --- 判定报告类型：只依据表单里的固定字段名，不做语义判断 ---
            const isFalsification = /###\s*(涉及哪一条假设|涉及哪一层|被证伪的理论主张|观测或实验描述)/.test(body);
            const isBug = /###\s*(复现步骤|期望行为|实际行为)/.test(body);
            const isFeature = /###\s*(它解决什么认知负荷问题|如何判断它有效)/.test(body);

            const labels = [];
            if (isFalsification) labels.push('falsification-report');
            if (isBug) labels.push('bug');
            if (isFeature) labels.push('enhancement');

            // --- 层级标签：从表单下拉项里抓 L1..L6 ---
            // 保持大写，与 tools/publish.py 里创建的标签名一致。
            // GitHub 对不存在的标签是**静默丢弃**的，不会报错，所以名字必须对得上。
            const layerHit = body.match(/\bL[1-6]\b/g) || [];
            const layers = [...new Set(layerHit)].sort();
            for (const l of layers) labels.push(l);

            // --- 假设编号：抓 H1..H18 ---
            const hypHit = body.match(/\bH(1[0-8]|[1-9])\b/g) || [];
            const hyps = [...new Set(hypHit)].sort((a, b) =>
              parseInt(a.slice(1)) - parseInt(b.slice(1)));

            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels,
              });
            }

            // --- 证伪报告的必备字段检查 ---
            // 注意：缺失字段只是「输入不完整」，不是「主张不成立」。
            // 我们要的是可检验性，不是设门槛。
            const required = [
              ['样本与统计', /效应量|effect size|\bd\s*=|p\s*[<=>]|置信区间|confidence interval/],
              ['统计功效', /统计功效|power|功效分析/],
              ['对照的证伪标准', /预注册|证伪标准|falsification|正典.*标准/],
              ['可复现信息', /复现|reproduc|数据|代码|脚本/],
            ];
            const missing = required.filter(([, re]) => !re.test(text)).map(([n]) => n);

            core.setOutput('is_falsification', String(isFalsification));
            core.setOutput('layers', layers.join(','));
            core.setOutput('hypotheses', hyps.join(','));
            core.setOutput('missing', missing.join('、'));
            core.setOutput('missing_count', String(missing.length));

            core.info(`类型: falsification=${isFalsification} bug=${isBug} feature=${isFeature}`);
            core.info(`层: ${layers.join(',') || '—'} / 假设: ${hyps.join(',') || '—'}`);
            core.info(`缺字段: ${missing.join('、') || '无'}`);

      # ------------------------------------------------------------------
      # 2. 欢迎 + 完整度提示（针对证伪报告）
      # ------------------------------------------------------------------
      - name: 发布完整度提示
        if: steps.parse.outputs.is_falsification == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const missing = '${{ steps.parse.outputs.missing }}';
            const layers = '${{ steps.parse.outputs.layers }}';
            const hyps = '${{ steps.parse.outputs.hypotheses }}';

            let msg = '### 收到证伪报告 · Falsification report received\n\n';
            msg += '感谢你按可失败性承诺提交这条报告。本仓库对证伪报告的处理规则是公开的：\n';
            msg += '**它不会被自动关闭、自动否决或降级。** 判定由人工完成。\n\n';

            if (layers || hyps) {
              msg += `已识别的范围：${layers ? '层级 ' + layers : ''}`;
              msg += `${layers && hyps ? ' · ' : ''}${hyps ? '假设 ' + hyps : ''}\n\n`;
            }

            if (missing) {
              msg += '#### 建议补充的材料\n\n';
              msg += '以下字段在当前描述中未检出。**补充它们是让报告更可检验，不是受理门槛**：\n\n';
              for (const m of missing.split('、')) msg += `- [ ] ${m}\n`;
              msg += '\n';
            } else {
              msg += '必备字段已齐全：样本与统计、统计功效、对照的预注册证伪标准、可复现信息。\n\n';
            }

            msg += '---\n';
            msg += '<sub>本提示由自动化流程生成，只检查输入是否完整，**不对报告的成立与否作任何判断**。</sub>\n';
            msg += '<sub>Generated by automation. It checks input completeness only and renders **no verdict** on the claim.</sub>';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: msg,
            });

      # ------------------------------------------------------------------
      # 3. 可选：LLM 分诊草稿
      #    没有配置 LLM_API_KEY 时脚本自行判空跳过，仓库依然完全可用。
      #
      #    注意：这里**不能**写 if: env.LLM_API_KEY != ''。
      #    GitHub 的 secrets 上下文在 step 级 if 中不可用，而 step 自己的 env
      #    在求值 if 时尚未注入 —— 那个条件会恒为假，导致该步永远不执行。
      #    因此去掉 if，改由脚本内 `if (!key) return;` 兜底；
      #    这样 secret 也只出现在这一步的 env 里，不污染整个 job。
      # ------------------------------------------------------------------
      - name: AI 分诊草稿（可选）
        id: ai
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        uses: actions/github-script@v7
        with:
          script: |
            const key = process.env.LLM_API_KEY;
            if (!key) { core.info('未配置 LLM_API_KEY，跳过'); return; }

            const base = process.env.LLM_BASE_URL || 'https://api.deepseek.com';
            const model = process.env.LLM_MODEL || 'deepseek-chat';
            const issue = context.payload.issue;

            const system = [
              '你是「意义智能」开源仓库的分诊助手。',
              '你的职责**仅限**：把 issue 归类到六层栈 L1–L6 与假设 H1–H18，并指出描述中缺失的信息。',
              '',
              '严格禁止：',
              '· 判断该理论主张是否成立、是否被证伪、是否有效；',
              '· 建议关闭、否决或降低该 issue 的优先级；',
              '· 以维护者口吻给出结论性回复。',
              '',
              '六层：L1 减负 / L2 可体验 / L3 意义生成 / L4 价值评估 / L5 方向选择 / L6 反思与审视递归。',
              '若无法确定，就写「无法确定」，不要猜。',
              '',
              '输出 JSON：{"layer":"L1..L6 或 无法确定","hypotheses":["H1"],"kind":"证伪报告|缺陷|建议|提问|其他","missing":["缺失的材料"],"note":"一句中立的分诊说明"}',
            ].join('\n');

            const user = `标题：${issue.title}\n\n正文：\n${(issue.body || '').slice(0, 6000)}`;

            let out;
            try {
              const resp = await fetch(`${base}/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                body: JSON.stringify({
                  model,
                  messages: [{ role: 'system', content: system }, { role: 'user', content: user }],
                  temperature: 0,
                  response_format: { type: 'json_object' },
                }),
              });
              if (!resp.ok) {
                core.warning(`LLM 调用失败 HTTP ${resp.status}，跳过 AI 分诊`);
                return;
              }
              const data = await resp.json();
              out = JSON.parse(data.choices[0].message.content);
            } catch (e) {
              core.warning(`AI 分诊出错，已跳过：${e.message}`);
              return;
            }

            const lines = [
              '### 🤖 AI 分诊草稿 · machine triage draft',
              '',
              '> **这不是裁决，也不是维护者的回复。** 它只做归类，供维护者节省阅读时间。',
              '> 任何关于理论是否成立、是否被证伪的判断，都由人类作出。',
              '',
              `| 项 | 值 |`,
              `|---|---|`,
              `| 归类层级 | ${out.layer || '无法确定'} |`,
              `| 涉及假设 | ${(out.hypotheses || []).join(', ') || '—'} |`,
              `| 类型 | ${out.kind || '—'} |`,
              `| 建议补充 | ${(out.missing || []).join('、') || '—'} |`,
              '',
              `说明：${out.note || '—'}`,
              '',
              '<sub>模型输出可能出错。若与你的判断不符，请忽略它——以人工判断为准。</sub>',
            ];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: lines.join('\n'),
            });
