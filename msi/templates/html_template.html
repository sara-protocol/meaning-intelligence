<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meaning Intelligence</title>
<style>
:root{--bg:#0a0c10;--card:#141820;--cyan:#00e5ff;--purple:#bb86fc;--text:#e0e6ed;--sub:#8b95a5;--border:#2a2f3a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:30px 15px;min-height:100vh}
.app{width:100%;max-width:900px;background:var(--card);border-radius:16px;padding:25px;border:1px solid var(--border);box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(0,229,255,.1);display:flex;flex-direction:column;gap:20px}
header{text-align:center;border-bottom:1px solid var(--border);padding-bottom:15px;position:relative}
h1{font-size:1.8rem;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.subtitle{color:var(--sub);font-size:.9rem}
.lang-btn{position:absolute;right:0;top:0;background:rgba(0,229,255,.08);border:1px solid var(--cyan);color:var(--cyan);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:600}
.lang-btn:hover,.lang-btn:focus-visible{background:var(--cyan);color:#000}
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--border);color:var(--sub);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem}
.tab:hover{border-color:var(--cyan);color:var(--text)}
.tab[aria-selected=true]{background:rgba(0,229,255,.1);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.2)}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.panel[hidden]{display:none}
.box{background:#0f1218;border-radius:12px;border:1px solid var(--border);padding:15px}
video{width:100%;max-height:480px;border-radius:8px;border:1px solid var(--cyan);background:#000}
.note{color:var(--sub);font-size:.8rem;margin-top:10px;text-align:center}
.warn{color:var(--purple)}
.slider{display:flex;flex-direction:column;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;background:#1f2530;border-radius:4px;outline-offset:6px;margin:15px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--cyan);cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.6)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--cyan);cursor:pointer}
#stageSlider{width:85%}
.labels{width:85%;display:flex;justify-content:space-between;gap:4px;font-size:.75rem;color:var(--sub)}
.labels button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:2px 0;text-align:center;flex:1}
.labels button.on{color:var(--cyan);font-weight:700}
.stage{min-height:210px;margin-top:15px;display:flex;align-items:center;justify-content:center;text-align:center}
.stage>div{width:100%}
.stage>div[hidden]{display:none}
.noise{font-family:monospace;font-size:.8rem;color:#667;line-height:1.5}
.ste{font-size:1.1rem;line-height:1.9;color:var(--cyan);font-weight:500}
.nodes{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.node{padding:8px 16px;border-radius:6px;border:1px solid}
.playbtn{margin-top:14px;background:transparent;border:1px solid var(--purple);color:var(--purple);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem}
.playbtn:hover{background:var(--purple);color:#000}
canvas{width:100%;max-width:480px;height:130px;background:var(--bg);border-radius:8px;border:1px solid var(--border);display:block;margin:8px auto}
.ent{display:flex;align-items:center;justify-content:center;gap:10px;font-size:.8rem;color:var(--sub)}
.ent input{width:160px;margin:0}
.vid{width:90px;height:50px;background:#1a1f2b;border-radius:6px;border:1px solid var(--purple);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--purple);font-size:1.3rem}
.sup{color:var(--cyan);font-size:.95rem;font-weight:500}
.mm{margin-bottom:18px}
.mm h3{font-size:.9rem;color:var(--sub);margin-bottom:8px;font-weight:600}
.mermaid{display:flex;justify-content:center;overflow-x:auto}
pre{background:#0f1218;padding:15px;border-radius:12px;border:1px solid var(--border);overflow:auto;max-height:420px;color:#a9b7c6;font:.78rem/1.45 ui-monospace,Menlo,Consolas,monospace}
h4{margin:14px 0 6px;font-size:.85rem;color:var(--cyan)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.card{margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:#0f1218;text-align:left;font-size:.85rem;line-height:1.6}
.card h3{font-size:1.05rem;margin-bottom:4px}
.card .def{color:var(--text);margin-bottom:8px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;color:var(--sub)}
.card dt{white-space:nowrap}
.card dd{color:var(--text)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid;font-size:.75rem;margin-right:6px}
.src{margin-top:10px;font-size:.72rem;color:var(--sub)}
svg.viz{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
svg text{font-family:inherit}
.path{cursor:pointer;transition:opacity .25s}.path:focus-visible{outline:2px solid var(--purple)}
.cols{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.cols .arr{color:var(--purple);font-size:1.4rem}
.mini{max-width:210px;font-size:.72rem;color:#667;font-family:monospace;line-height:1.5;text-align:left}

</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <button class="lang-btn" id="langBtn" type="button"></button>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <section class="panel" role="tabpanel" id="p0" aria-labelledby="t0">
    <div class="box">
      <video id="video" controls preload="metadata"><source id="vsrc"></video>
      <p class="note warn" id="vmiss" hidden></p>
      <p class="note"><span id="vdesc"></span> · <span id="tlsrc"></span></p>
    </div>
  </section>

  <section class="panel" role="tabpanel" id="p1" aria-labelledby="t1" hidden>
    <div class="slider">
      <input type="range" id="stageSlider" min="1" value="1" step="1" aria-label="layer">
      <div class="labels" id="labels"></div>
    </div>
    <div class="box stage">
      <div id="v1"><div class="cols">
        <div class="mini" id="v1noise"></div><div class="arr" aria-hidden="true">→</div>
        <div class="ste" id="v1ste"></div><div class="arr" aria-hidden="true">→</div>
        <div class="nodes"><div class="node" id="n1"></div><div class="arr" aria-hidden="true">→</div><div class="node" id="n2"></div></div>
      </div></div>
      <div id="v2" hidden>
        <p class="note" id="hint" style="margin:0"></p>
        <canvas id="cv" role="img"></canvas>
        <label class="ent"><span id="entLbl"></span><input type="range" id="entropy" min="0" max="100" value="75"></label>
      </div>
      <div id="v3" hidden><svg class="viz" id="svg3" viewBox="0 0 400 200" role="img"></svg></div>
      <div id="v4" hidden><svg class="viz" id="svg4" viewBox="0 0 400 220" role="img"></svg></div>
      <div id="v5" hidden><p class="note" id="pickHint" style="margin:0 0 6px"></p><svg class="viz" id="svg5" viewBox="0 0 400 200" role="group"></svg></div>
      <div id="v6" hidden><svg class="viz" id="svg6" viewBox="0 0 400 220" role="img"></svg><p class="note" id="recNote"></p></div>
    </div>
    <div class="card" id="card"></div>
    <p class="src" id="srcNote"></p>
    <div style="text-align:center"><button class="playbtn" id="playStage" type="button"></button></div>
  </section>

  <section class="panel" role="tabpanel" id="p2" aria-labelledby="t2" hidden><div id="mmHost"></div></section>

  <section class="panel" role="tabpanel" id="p3" aria-labelledby="t3" hidden>
    <h4 id="srcPyH"></h4><pre><code id="srcPy"></code></pre>
    <h4 id="srcCfgH"></h4><pre><code id="srcCfg"></code></pre>
  </section>
</div>

<script>
/* ---- injected by build.py from config.json (do not edit by hand) ---- */
const CFG = __CONFIG_JSON__;
const TIMELINE = __TIMELINE_JSON__;
const TIMELINE_SOURCE = __TIMELINE_SOURCE__;
const MERMAID = __MERMAID_JSON__;
const SRC_PY = __SRC_PY__;
const SRC_CFG = __SRC_CFG__;
/* --------------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const C = CFG.colors, LAYERS = CFG.layers, BANDS = CFG.bands, EV = CFG.evidence_scale;
let lang = CFG.default_lang, tab = 0, stage = 1, chosen = CFG.demo.chosen_path;
const ui = () => CFG.ui[lang];
const bandOf = l => BANDS.find(b => b.id === l.band);
const tierColor = l => C[bandOf(l).tier];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NS = 'http://www.w3.org/2000/svg';

for (const [k, v] of Object.entries({bg:C.bg,card:C.dark,cyan:C.cyan,purple:C.purple,sub:C.gray}))
  document.documentElement.style.setProperty('--' + k, v);

/* ---------- skeleton ---------- */
(() => {
  for (let i = 0; i < 4; i++) {
    const b = document.createElement('button');
    b.className = 'tab'; b.id = 't' + i; b.type = 'button';
    b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', 'p' + i);
    b.addEventListener('click', () => switchTab(i));
    b.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') switchTab((tab + 1) % 4, true);
      if (e.key === 'ArrowLeft') switchTab((tab + 3) % 4, true);
    });
    $('tabs').appendChild(b);
  }
  $('stageSlider').max = LAYERS.length;
  LAYERS.forEach((l, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.id = 'lbl' + (i + 1);
    b.addEventListener('click', () => setStage(i + 1));
    $('labels').appendChild(b);
  });
  $('stageSlider').addEventListener('input', e => setStage(+e.target.value));
  $('langBtn').addEventListener('click', () => { lang = CFG.languages[(CFG.languages.indexOf(lang) + 1) % CFG.languages.length]; applyLang(); });
  $('playStage').addEventListener('click', () => { switchTab(0); seek(LAYERS[stage - 1].id, true); });
  $('vsrc').src = CFG.video.file;
  $('vsrc').addEventListener('error', () => { $('vmiss').hidden = false; });
  $('video').load();
})();

/* ---------- SVG helpers ---------- */
const svg = (id, html) => { $(id).innerHTML = html; };
const dotPositions = () => {                       // 9 nodes settled around the 3 vertices (same rule as the Manim act)
  const V = [[200, 28], [62, 168], [338, 168]], c = [200, 121], out = [];
  for (let i = 0; i < 9; i++) {
    const v = V[i % 3], a = Math.floor(i / 3) * 2.1 + i;
    out.push([v[0] + (c[0] - v[0]) * 0.24 + 15 * Math.cos(a), v[1] + (c[1] - v[1]) * 0.24 + 15 * Math.sin(a)]);
  }
  return { V, pts: out };
};

function renderTriangle(id, withRings) {
  const { V, pts } = dotPositions(), K = CFG.content.axes[lang], col = C.purple;
  let h = `<polygon points="${V.map(v => v.join(',')).join(' ')}" fill="${C.fill_purple}" fill-opacity=".6" stroke="${col}" stroke-width="2"/>`;
  h += `<text x="200" y="16" text-anchor="middle" fill="${col}" font-size="13" font-weight="700">${esc(K[0])}</text>`;
  h += `<text x="62" y="190" text-anchor="middle" fill="${col}" font-size="13" font-weight="700">${esc(K[1])}</text>`;
  h += `<text x="338" y="190" text-anchor="middle" fill="${col}" font-size="13" font-weight="700">${esc(K[2])}</text>`;
  pts.forEach(([x, y], i) => {
    h += `<circle cx="${x}" cy="${y}" r="5" fill="${C.cyan}"/>`;
    if (withRings) h += `<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="${EV[CFG.demo.assess_levels[i]]}" stroke-width="3"/>`;
  });
  if (withRings) {
    EV.forEach((c, i) => { h += `<rect x="${118 + i * 24}" y="198" width="20" height="10" fill="${c}"/>`; });
    h += `<text x="110" y="207" text-anchor="end" fill="${C.gray}" font-size="9">E0</text><text x="${118 + 7 * 24 + 2}" y="207" fill="${C.gray}" font-size="9">E6</text>`;
    h += `<text x="200" y="219" text-anchor="middle" fill="${C.gray}" font-size="8">${esc(CFG.content.illustrative[lang])}</text>`;
  }
  svg(id, h);
}

function renderPaths() {
  const cand = CFG.content.candidates[lang], ys = [38, 100, 162], x0 = 24, x1 = 300;
  let h = `<circle cx="${x0}" cy="100" r="7" fill="#fff"/>`;
  ys.forEach((y, i) => {
    const on = i === chosen, col = on ? C.cyan : C.amber;
    h += `<g class="path" data-i="${i}" tabindex="0" role="button" aria-label="${esc(cand[i])}" style="opacity:${on ? 1 : .2}">` +
         `<path d="M${x0} 100 C${x0 + 120} 100 ${x1 - 120} ${y} ${x1} ${y}" fill="none" stroke="${col}" stroke-width="${on ? 5 : 3}"/>` +
         `<path d="M${x0} 100 C${x0 + 120} 100 ${x1 - 120} ${y} ${x1} ${y}" fill="none" stroke="transparent" stroke-width="22" pointer-events="stroke"/>` +
         `<circle cx="${x1}" cy="${y}" r="${on ? 9 : 6}" fill="${col}"/>` +
         `<text x="${x1 + 16}" y="${y + 4}" fill="${col}" font-size="13">${esc(cand[i])}</text></g>`;
  });
  svg('svg5', h);
  document.querySelectorAll('#svg5 .path').forEach(g => {
    const pick = () => { chosen = +g.dataset.i; renderPaths(); };
    g.addEventListener('click', pick);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
}

function renderSpiral() {
  const cx = 200, cy = 134, pt = t => { const r = 24 + 46 * t / (2 * Math.PI), a = -Math.PI / 2 + t; return [cx + r * Math.cos(a), cy + r * Math.sin(a), Math.cos(a), Math.sin(a)]; };
  let d = '';
  for (let i = 0; i <= 80; i++) { const p = pt(i / 80 * 2 * Math.PI); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }
  let h = `<path d="${d}" fill="none" stroke="${C.amber}" stroke-width="3"/>`;
  const a = pt(0), b = pt(2 * Math.PI);
  h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#fff" stroke-dasharray="4 3"/>`;
  for (let i = 0; i <= 6; i++) {
    const p = pt(i * 2 * Math.PI / 6), name = i < 6 ? 'L' + (i + 1) : "L1′", col = i < 6 ? C.cyan : '#fff';
    h += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${col}"/><text x="${p[0] + p[2] * 15}" y="${p[1] + p[3] * 15 + 4}" text-anchor="middle" fill="${col}" font-size="11">${name}</text>`;
  }
  h += `<g transform="translate(200 20)"><ellipse rx="24" ry="10" fill="none" stroke="${C.cyan}" stroke-width="2"/><circle r="6" fill="${C.cyan}"/></g>`;
  svg('svg6', h);
}

/* ---------- language ---------- */
function applyLang() {
  const u = ui(), K = CFG.content;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.title = u.title;
  $('title').textContent = u.title; $('subtitle').textContent = u.subtitle; $('langBtn').textContent = u.langBtn;
  u.tabs.forEach((t, i) => $('t' + i).textContent = t);
  LAYERS.forEach((l, i) => { $('lbl' + (i + 1)).textContent = l.id + ' ' + l.name[lang]; });
  $('vdesc').textContent = u.videoDesc + ' · ' + CFG.video.quality;
  $('tlsrc').textContent = u.timelineSrc[TIMELINE_SOURCE];
  $('vmiss').textContent = u.videoMissing;
  $('v1noise').textContent = K.overload_text[lang];
  $('v1ste').replaceChildren(...K.ste_lines[lang].map(l => { const d = document.createElement('div'); d.textContent = l; return d; }));
  $('n1').textContent = K.node1[lang]; $('n1').style.cssText = `color:${C.cyan};border-color:${C.cyan}`;
  $('n2').textContent = K.node2[lang]; $('n2').style.cssText = `color:${C.purple};border-color:${C.purple}`;
  $('hint').textContent = u.canvasHint; $('entLbl').textContent = u.entropy + ':';
  $('pickHint').textContent = u.pickPath; $('recNote').textContent = u.recursion;
  $('playStage').textContent = u.playStage;
  $('srcNote').textContent = CFG.source_note[lang];
  $('srcPyH').textContent = u.srcPy; $('srcCfgH').textContent = u.srcCfg;
  $('srcPy').textContent = SRC_PY; $('srcCfg').textContent = SRC_CFG;
  renderTriangle('svg3', false); renderTriangle('svg4', true); renderPaths(); renderSpiral();
  setStage(stage, true);
  mermaidDirty = true;
  if (tab === 2) renderMermaid();
}

/* ---------- tabs ---------- */
function switchTab(i, focus) {
  tab = i;
  for (let k = 0; k < 4; k++) {
    $('p' + k).hidden = k !== i;
    const b = $('t' + k);
    b.setAttribute('aria-selected', k === i); b.tabIndex = k === i ? 0 : -1;
  }
  if (focus) $('t' + i).focus();
  if (i !== 0) $('video').pause();
  syncCanvas();
  if (i === 2) renderMermaid();
}

/* ---------- layers ---------- */
function setStage(n, silent) {
  stage = n;
  const L = LAYERS[n - 1], B = bandOf(L), u = ui(), col = tierColor(L);
  $('stageSlider').value = n;
  $('stageSlider').setAttribute('aria-valuetext', `${L.id} ${L.name[lang]}`);
  LAYERS.forEach((l, i) => {
    const on = i + 1 === n;
    $('lbl' + (i + 1)).classList.toggle('on', on);
    $('lbl' + (i + 1)).style.color = on ? tierColor(l) : '';
    $('v' + (i + 1)).hidden = !on;
  });
  const row = (k, v) => `<dt>${esc(k)}</dt><dd>${v}</dd>`;
  $('card').innerHTML =
    `<h3 style="color:${col}">${esc(L.id)} · ${esc(L.name[lang])} <span style="color:${C.gray};font-weight:400;font-size:.8rem">${lang === 'zh' ? esc(L.name.en) : esc(L.name.zh)}</span></h3>` +
    `<div class="def">${esc(L.definition[lang])}</div><dl>` +
    row(u.card.band, `<span class="badge" style="color:${col};border-color:${col}">${esc(B.label[lang])}</span>${esc(B.problem[lang])}`) +
    row(u.card.anchor, esc(L.anchor[lang])) +
    row(u.card.evidence, esc(L.evidence)) +
    row(u.card.falsifier, esc(L.falsifier[lang])) + `</dl>`;
  if (!silent) seek(L.id, false);
  syncCanvas();
}

function seek(id, play) {
  const v = $('video'), t = TIMELINE[id];
  if (t === undefined) return;
  const go = () => { v.currentTime = t; if (play) v.play().catch(() => {}); };
  v.readyState > 0 ? go() : v.addEventListener('loadedmetadata', go, { once: true });
}

/* ---------- canvas (L2): particles converge to a grid as entropy -> 0 ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 460, H = 130, parts = [], raf = null;
function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
const CY = hex2rgb(C.cyan), PU = hex2rgb(C.purple);
function setupCanvas() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width) return false;
  W = r.width; H = 130;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rnd = rng(7); parts = [];
  for (let i = 0; i < 50; i++) parts.push({ bx: rnd() * W, by: rnd() * H, ph: rnd() * 6.28,
    tx: W * (0.1 + 0.8 * (i % 10) / 9), ty: H * (0.15 + 0.7 * Math.floor(i / 10) / 4) });
  return true;
}
function drawCanvas(now) {
  const e = $('entropy').value / 100, k = reduceMotion ? 0 : now * 0.002;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = `rgb(${CY.map((c, j) => Math.round(c + (PU[j] - c) * e))})`;
  parts.forEach(p => {
    const x = p.tx + (p.bx - p.tx) * e + Math.sin(k + p.ph) * 12 * e;
    const y = p.ty + (p.by - p.ty) * e + Math.cos(k + p.ph) * 12 * e;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, 6.2832); ctx.fill();
  });
  cv.setAttribute('aria-label', `${ui().entropy}: ${Math.round(e * 100)}%`);
}
function loop(now) { drawCanvas(now); raf = requestAnimationFrame(loop); }
function syncCanvas() {
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  if (tab !== 1 || stage !== 2) return;
  if (!setupCanvas()) return;
  reduceMotion ? drawCanvas(0) : (raf = requestAnimationFrame(loop));
}
$('entropy').addEventListener('input', () => { if (reduceMotion) drawCanvas(0); });
addEventListener('resize', () => { if (tab === 1) syncCanvas(); });

/* ---------- mermaid (pinned CDN; falls back to source) ---------- */
let mermaidDirty = true;
function renderMermaid() {
  if (!mermaidDirty) return;
  mermaidDirty = false;
  const host = $('mmHost'), u = ui(), ok = !!window.mermaid, nodes = [];
  host.replaceChildren();
  if (!ok) { const p = document.createElement('p'); p.className = 'note warn'; p.textContent = u.mermaidFail; host.appendChild(p); }
  ['pipeline', 'scenes', 'palette'].forEach((k, i) => {
    const wrap = document.createElement('div'); wrap.className = 'mm';
    const h = document.createElement('h3'); h.textContent = u.diagrams[i]; wrap.appendChild(h);
    const box = document.createElement(ok ? 'div' : 'pre'); box.className = ok ? 'box mermaid' : '';
    box.textContent = MERMAID[lang][k]; wrap.appendChild(box); host.appendChild(wrap);
    if (ok) nodes.push(box);
  });
  if (ok) mermaid.run({ nodes }).catch(() => { mermaidDirty = true; });
}
window.addEventListener('load', () => { if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: 'dark' }); if (tab === 2) { mermaidDirty = true; renderMermaid(); } });

applyLang();
switchTab(0);
</script>
